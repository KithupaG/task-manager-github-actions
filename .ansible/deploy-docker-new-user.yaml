---
- name: Install Docker
  hosts: tag_Role_docker_server
  become: yes
  become_user: root
  tasks:
    - name: Make sure docker is installed
      yum:
        name: docker
        state: present
        update_cache: yes

- name: Install docker compose
  hosts: tag_Role_docker_server
  become: yes
  become_user: kithupag
  tasks:
    - name: Create docker compose directory
      file:
        path: ~/.docker/cli-plugins
        state: directory

    - name: Get architecture
      shell: uname -m
      register: architecture

    - name: Download docker compose
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ architecture.stdout }}
        dest: ~/.docker/cli-plugins/docker-compose
        mode: +x

- name: Start docker
  hosts: tag_Role_docker_server
  become: yes
  become_user: root
  tasks:
    - name: Ensure docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add kithupag to docker group
      user:
        name: kithupag
        groups: docker
        append: yes

- name: Deploy application
  hosts: tag_Role_docker_server
  become: yes
  become_user: kithupag
  vars:
    image_tag: "{{ image_tag | default('latest') }}"
    dockerhub_username: "{{ dockerhub_username }}"
    app_dir: ~/task-manager
  tasks:
    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory

    - name: Write docker-compose file
      copy:
        dest: "{{ app_dir }}/docker-compose.yaml"
        content: |
          version: "3.8"
          services:
            client:
              image: {{ dockerhub_username }}/task-manager-client:{{ image_tag }}
              ports:
                - "80:80"
              restart: unless-stopped
              depends_on:
                - server

            server:
              image: {{ dockerhub_username }}/task-manager-server:{{ image_tag }}
              ports:
                - "3000:3000"
              restart: unless-stopped
              env_file:
                - .env

    - name: Copy .env file to app directory
      copy:
        src: .env
        dest: "{{ app_dir }}/.env"
        mode: '0600'
      ignore_errors: yes  # skip if no .env exists locally

    - name: Pull latest images
      shell: docker compose pull
      args:
        chdir: "{{ app_dir }}"

    - name: Stop existing containers
      shell: docker compose down --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes

    - name: Start containers
      shell: docker compose up -d
      args:
        chdir: "{{ app_dir }}"

    - name: Verify containers are running
      shell: docker compose ps
      args:
        chdir: "{{ app_dir }}"
      register: compose_status

    - name: Print container status
      debug:
        msg: "{{ compose_status.stdout }}"